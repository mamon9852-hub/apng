<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable B</title>
  <style>
    :root{
      --brand-green:#23c7b7;
      --brand-cyan:#1fb8c6;
      --brand-yellow:#f4c84a;
      --brand-ink:#0b1b1f;
      --brand-grad: linear-gradient(135deg, var(--brand-green) 0%, var(--brand-cyan) 55%, var(--brand-yellow) 100%);
      --ui-line:#e9eef0;
      --shadow: 0 10px 30px rgba(0,0,0,.18);
      --chat-recv:#f3f6f7;
      --chat-send:#14b8a6;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#000; }
    #game-container{ position:relative; width:100%; height:100%; overflow:hidden; background:#000; }

    .slow-fade-in{ animation: slowFade 2.0s ease-out forwards; }
    @keyframes slowFade{ 0%{opacity:0} 100%{opacity:1} }

    /* ===== Match (開始画面) ===== */
    #match-screen{ position:absolute; inset:0; display:block; z-index:500; opacity:0; background:#000; }
    .match-wrap{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      padding:18px;
      background: radial-gradient(1200px 700px at 50% -10%, rgba(35,199,183,.30), rgba(0,0,0,.98) 60%);
    }
    .match-art{
      width:min(560px, 94vw);
      aspect-ratio: 9 / 16;
      border-radius:24px; overflow:hidden;
      box-shadow: var(--shadow);
      background:#0b0f12;
      position:relative;
      border:1px solid rgba(255,255,255,.08);
    }
    .match-art img{ width:100%; height:100%; object-fit:cover; display:block; }
    .match-pulse{
      position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
      width:10px; height:10px; border-radius:50%;
      background: rgba(255,255,255,.92);
      box-shadow: 0 0 0 10px rgba(255,255,255,.12);
      animation: pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse{
      0%{ transform:translateX(-50%) scale(.9); opacity:.35; }
      50%{ transform:translateX(-50%) scale(1.1); opacity:.9; }
      100%{ transform:translateX(-50%) scale(.9); opacity:.35; }
    }

    /* Close */
    .close{
      position:absolute; right:10px; top:10px;
      width:38px; height:38px; border-radius:12px;
      border:1px solid rgba(233,238,240,.7);
      background: rgba(255,255,255,.92);
      color:#0f172a; font-weight:900; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      z-index:10;
    }

    /* ===== Chat ===== */
    #chat-screen{ position:absolute; inset:0; display:none; flex-direction:column; z-index:600; background:#fff; }
    .chat-head{
      height:62px; display:flex; align-items:center; justify-content:center;
      border-bottom:1px solid var(--ui-line);
      background:#fff; flex:0 0 auto;
    }
    .chat-head .who{ font-weight:1000; color:var(--brand-ink); display:flex; align-items:center; gap:10px; }
    .chat-head .mini{
      font-size:11px; font-weight:900; color:var(--brand-ink);
      padding:6px 10px; border-radius:999px;
      background: rgba(35,199,183,.10);
      border:1px solid rgba(35,199,183,.20);
    }
    .chat-body{
      flex:1 1 auto;
      padding:14px 14px 10px;
      overflow-y:auto;
      display:flex; flex-direction:column;
      background: linear-gradient(to bottom, rgba(35,199,183,.06), rgba(244,200,74,.04));
    }
    .msg{
      max-width:82%;
      padding:12px 14px;
      border-radius:18px;
      margin:0 0 10px;
      font-size:14px;
      line-height:1.45;
      word-break: break-word;
    }
    .msg.received{ background: var(--chat-recv); align-self:flex-start; border:1px solid rgba(0,0,0,.04); }
    .msg.sent{ background: var(--chat-send); color:#fff; align-self:flex-end; box-shadow: 0 8px 20px rgba(20,184,166,.18); }
    .chat-footer{ flex:0 0 auto; padding:12px 14px 16px; border-top:1px solid var(--ui-line); background:#fff; }
    .choice-btn{
      width:100%;
      padding:12px 12px;
      border-radius:16px;
      border: 1.5px solid rgba(35,199,183,.55);
      color:var(--brand-ink);
      font-weight:1000;
      background:#fff;
      cursor:pointer;
      margin-bottom:10px;
      text-align:left;
    }
    .choice-btn:active{ transform: translateY(1px); }

    /* ===== CTA ===== */
    #cta-screen{
      position:absolute; inset:0; display:none; align-items:center; justify-content:center;
      z-index:700; padding:22px; opacity:0;
      background:
        radial-gradient(900px 520px at 30% 10%, rgba(35,199,183,.45), rgba(255,255,255,0) 55%),
        radial-gradient(900px 520px at 90% 30%, rgba(244,200,74,.35), rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #ffffff 0%, #f6fffd 55%, #ffffff 100%);
    }
    .cta-panel{
      width:min(520px, 92vw);
      border-radius:28px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(233,238,240,.95);
      box-shadow: 0 18px 46px rgba(0,0,0,.14);
      padding:22px 18px 18px;
      display:flex; flex-direction:column; align-items:center; gap:14px;
    }
    .app-icon{
      width:124px; height:124px; border-radius:32px; overflow:hidden;
      border:1px solid rgba(0,0,0,.06);
      box-shadow: 0 18px 40px rgba(0,0,0,.14);
      background:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    .app-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
    .app-icon::before, .app-icon::after{ content:none !important; }
    .cta-btn{
      width:100%;
      padding:16px 14px; border-radius:18px; border:none;
      background: var(--brand-grad);
      color:#fff; font-weight:1000; font-size:16px; cursor:pointer;
      box-shadow: 0 14px 30px rgba(35,199,183,.20);
    }
    .cta-replay{
      cursor:pointer; user-select:none; width:100%;
      padding:12px 14px; border-radius:18px;
      border:1px solid var(--ui-line);
      background:#fff; font-weight:900; color:var(--brand-ink); text-align:center;
    }
  </style>
</head>
<body>
  <div id="game-container">

    <button class="close" id="btn-close" type="button">×</button>

    <div id="match-screen">
      <div class="match-wrap">
        <div class="match-art">
          <img id="match-img" alt="" src="" />
          <div class="match-pulse" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div id="chat-screen">
      <div class="chat-head">
        <div class="who"><span id="chat-name">ひなた</span><span class="mini">トーク</span></div>
      </div>
      <div class="chat-body" id="chat-history"></div>
      <div class="chat-footer" id="chat-options"></div>
    </div>

    <div id="cta-screen">
      <div class="cta-panel">
        <div class="app-icon"><img id="cta-logo-img" alt="" src="" /></div>
        <button class="cta-btn" id="cta-install" type="button">ダウンロード</button>
        <div class="cta-replay" id="cta-replay" role="button" tabindex="0">もう一度</div>
      </div>
    </div>

  </div>

      var $ = function(id){ return document.getElementById(id); };

      var elMatch = $('match-screen');
      var elMatchImg = $('match-img');

      var elChat = $('chat-screen');
      var elChatHistory = $('chat-history');
      var elChatOptions = $('chat-options');

      var elCta = $('cta-screen');
      var elCtaLogo = $('cta-logo-img');

      var btnClose = $('btn-close');
      var btnInstall = $('cta-install');
      var btnReplay = $('cta-replay');

      var timers = [];
      function safeSetTimeout(fn, ms){
        var t = setTimeout(function(){ try{ fn(); }catch(e){} }, ms);
        timers.push(t);
        return t;
      }
      function clearTimers(){
        for (var i=0;i<timers.length;i++){ try{ clearTimeout(timers[i]); }catch(e){} }
        timers = [];
      }

      function init(){
        try{
          elCtaLogo.src = ASSETS.logo;
          elMatchImg.src = ASSETS.matchScene;

          btnClose.onclick = function(){ handleCloseClicked(); };
          btnInstall.onclick = function(){ handleInstall(); };
          btnReplay.onclick = function(){ replay(); };

          /* 初期：マッチ表示（自動再生はしない条件の中でも、開始画面の表示はOKと解釈） */
          elMatch.classList.remove('slow-fade-in');
          void elMatch.offsetWidth;
          elMatch.classList.add('slow-fade-in');

          /* マッチ→チャットは自動 */
          safeSetTimeout(function(){ startChat(); }, 1200);

          safeSetTimeout(function(){
            try{ window.gameReady && window.gameReady(); } catch(e){}
            try{ gameStart(); } catch(e){}
          }, 50);
        }catch(e){}
      }

      function startChat(){
        try{
          elMatch.style.display = 'none';
          elChat.style.display = 'flex';
          elChatHistory.innerHTML = '';
          elChatOptions.innerHTML = '';

          addMessage('received', "マッチありがとうございます。ひなたです、よろしくお願いします。");
          safeSetTimeout(function(){
            showOptions(
              ["こちらこそ、よろしくお願いします。", "マッチありがとうございます。よろしくお願いします。"],
              step1
            );
          }, 650);
        }catch(e){}
      }

      function step1(choice){
        addMessage('sent', choice);
        safeSetTimeout(function(){
          addMessage('received', "お休みの日って、普段は何をして過ごすことが多いですか？");
          safeSetTimeout(function(){
            showOptions(
              ["カフェに行ったり、散歩したりすることが多いです。", "家で映画やドラマを見て過ごすことが多いです。"],
              step2
            );
          }, 650);
        }, 850);
      }

      function step2(choice){
        addMessage('sent', choice);
        safeSetTimeout(function(){
          var reply = (choice.indexOf("カフェ") >= 0)
            ? "いいですね。どんな雰囲気のお店が好きですか？"
            : "いいですね。どんなジャンルを見ることが多いですか？";
          addMessage('received', reply);

          safeSetTimeout(function(){
            if (choice.indexOf("カフェ") >= 0){
              showOptions(
                ["落ち着いた雰囲気のお店が好きです。", "景色がきれいなお店が好きです。"],
                step3
              );
            } else {
              showOptions(
                ["恋愛ものやコメディが多いです。", "サスペンスやミステリーが多いです。"],
                step3
              );
            }
          }, 650);
        }, 900);
      }

      function step3(choice){
        addMessage('sent', choice);
        safeSetTimeout(function(){
          addMessage('received', "なるほど。もう少し詳しく聞きたいです。おすすめ、具体的に教えてもらえますか？");
          safeSetTimeout(function(){ showCTA(); }, 950);
        }, 900);
      }

      function addMessage(type, text){
        var div = document.createElement('div');
        div.className = 'msg ' + type;
        div.textContent = text;
        elChatHistory.appendChild(div);
        elChatHistory.scrollTop = elChatHistory.scrollHeight;
      }

      function showOptions(opts, cb){
        elChatOptions.innerHTML = '';
        for (var i=0;i<opts.length;i++){
          (function(optText){
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'choice-btn';
            btn.textContent = optText;
            btn.onclick = function(){
              try{ elChatOptions.innerHTML=''; cb(optText); }catch(e){}
            };
            elChatOptions.appendChild(btn);
          })(opts[i]);
        }
      }

      function showCTA(){
        try{
          elMatch.style.display = 'none';
          elChat.style.display = 'none';

          elCta.style.display = 'flex';
          elCta.classList.remove('slow-fade-in');
          void elCta.offsetWidth;
          elCta.classList.add('slow-fade-in');

          try{ window.gameEnd && window.gameEnd(); }catch(e){}
        }catch(e){}
      }

      function handleInstall(){
        try{
          try{ window.gameEnd && window.gameEnd(); }catch(e){}
          try{ window.install && window.install(); }catch(e){}
          window.location.href = TARGET_URL;
        }catch(e){
          try{ window.location.href = TARGET_URL; }catch(e2){}
        }
      }

      function handleCloseClicked(){
        try{
          gameClose();
          showCTA();
        }catch(e){}
      }

      function replay(){
        try{
          clearTimers();

          /* リプレイは「マッチから」再開 */
          elCta.style.display = 'none';
          elChat.style.display = 'none';

          elMatch.style.display = 'block';
          elMatch.classList.remove('slow-fade-in');
          void elMatch.offsetWidth;
          elMatch.classList.add('slow-fade-in');

          safeSetTimeout(function(){ startChat(); }, 1200);
        }catch(e){}
      }

      if (document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
